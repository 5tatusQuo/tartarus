name: Tagged release acceptance
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Immutable Tartarus tag or commit
        required: true

permissions:
  contents: read

jobs:
  compact:
    runs-on: [self-hosted, tartarus-acceptance]
    timeout-minutes: 480
    env:
      TARTARUS_CONFIG: ${{ runner.temp }}/tartarus/config.toml
      TARTARUS_CACHE_ROOT: ${{ runner.temp }}/tartarus/cache
      TARTARUS_EVIDENCE_ROOT: ${{ runner.temp }}/tartarus/evidence
      LUDUS_CONFIG_PATH: ${{ runner.temp }}/tartarus/ludus.yml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install locked controller
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps .
      - name: Materialize runner-local Ludus configuration
        env:
          LUDUS_CONFIG_B64: ${{ secrets.LUDUS_CONFIG_B64 }}
        run: |
          install -d -m 0700 "$(dirname "$LUDUS_CONFIG_PATH")"
          printf '%s' "$LUDUS_CONFIG_B64" | base64 --decode > "$LUDUS_CONFIG_PATH"
          chmod 0600 "$LUDUS_CONFIG_PATH"
      - name: Initialize and inspect
        env:
          MANAGEMENT_SOURCE: ${{ vars.MANAGEMENT_SOURCE }}
          BLOCKED_NETWORK: ${{ vars.BLOCKED_NETWORK }}
          HOST_MEMORY_GIB: ${{ vars.HOST_MEMORY_GIB }}
        run: |
          tartarus init --profile compact --config "$TARTARUS_CONFIG" \
            --evidence-root "$TARTARUS_EVIDENCE_ROOT" --cache-root "$TARTARUS_CACHE_ROOT" \
            --ludus-config "$LUDUS_CONFIG_PATH" --host-memory-gib "$HOST_MEMORY_GIB" \
            --management-source "$MANAGEMENT_SOURCE" --always-blocked-network "$BLOCKED_NETWORK"
          ludus --config "$LUDUS_CONFIG_PATH" range accessible --json \
            > "$RUNNER_TEMP/tartarus/ranges-before.json"
          tartarus doctor
      - name: Prepare, deploy, and verify compact profile
        run: |
          tartarus prepare --yes
          tartarus deploy --name "Tartarus acceptance $GITHUB_RUN_ID" --yes
          RANGE_ID="$(python -c 'import json,os; print(json.load(open(os.environ["TARTARUS_CACHE_ROOT"]+"/state/deployment.json"))["range_id"])')"
          printf '%s' "$RANGE_ID" > "$RUNNER_TEMP/tartarus/range-id"
          tartarus verify --range-id "$RANGE_ID"
      - name: Execute benign evidence and recovery fixture
        run: |
          RANGE_ID="$(cat "$RUNNER_TEMP/tartarus/range-id")"
          tartarus case create --case-id acceptance
          tartarus sample stage --case-id acceptance /bin/true
          SAMPLE_HASH="$(python -c 'import json,os; print(json.load(open(os.environ["TARTARUS_EVIDENCE_ROOT"]+"/acceptance/case.json"))["samples"][0]["sha256"])')"
          tartarus run start --range-id "$RANGE_ID" --case-id acceptance \
            --run-id benign --sha256 "$SAMPLE_HASH" --duration 30 --telemetry-profile deep --yes
          tartarus run stop --case-id acceptance --run-id benign --yes
      - name: Publish redacted acceptance manifests
        if: always()
        run: |
          install -d "$RUNNER_TEMP/tartarus/redacted"
          test ! -f "$TARTARUS_CACHE_ROOT/state/prepare-manifest.json" || \
            python scripts/redact_manifest.py "$TARTARUS_CACHE_ROOT/state/prepare-manifest.json" \
              "$RUNNER_TEMP/tartarus/redacted/deployment-manifest.json"
          RANGE_ID="$(cat "$RUNNER_TEMP/tartarus/range-id" 2>/dev/null || true)"
          test -z "$RANGE_ID" || test ! -f "$TARTARUS_EVIDENCE_ROOT/verification/$RANGE_ID.json" || \
            python scripts/redact_manifest.py "$TARTARUS_EVIDENCE_ROOT/verification/$RANGE_ID.json" \
              "$RUNNER_TEMP/tartarus/redacted/verification-report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tartarus-${{ inputs.ref }}-acceptance
          path: ${{ runner.temp }}/tartarus/redacted
      - name: Remove only the acceptance range
        if: always()
        run: |
          RANGE_ID="$(cat "$RUNNER_TEMP/tartarus/range-id" 2>/dev/null || true)"
          if test -z "$RANGE_ID" && test -f "$TARTARUS_CACHE_ROOT/state/deployment.json"; then
            RANGE_ID="$(python -c 'import json,os; print(json.load(open(os.environ["TARTARUS_CACHE_ROOT"]+"/state/deployment.json"))["range_id"])')"
          fi
          test -z "$RANGE_ID" || tartarus destroy --range-id "$RANGE_ID" --confirm
          ludus --config "$LUDUS_CONFIG_PATH" range accessible --json \
            > "$RUNNER_TEMP/tartarus/ranges-after.json"
          test ! -f "$RUNNER_TEMP/tartarus/ranges-before.json" || \
            python scripts/assert_range_inventory_unchanged.py \
              "$RUNNER_TEMP/tartarus/ranges-before.json" "$RUNNER_TEMP/tartarus/ranges-after.json"
