---
- name: Check Elastic Agent package baked into the owned template
  ansible.builtin.command: test -f /var/cache/tartarus/elastic-agent-9.5.5-amd64.deb
  changed_when: false
  failed_when: false
  register: tartarus_agent_cached_package

- name: Require the baked Elastic Agent package
  ansible.builtin.assert:
    that:
      - tartarus_agent_cached_package.rc == 0

- name: Install pinned standalone Elastic Agent
  ansible.builtin.apt:
    deb: /var/cache/tartarus/elastic-agent-9.5.5-amd64.deb
    state: present

- name: Keep Elastic Agent stopped until controller credential delivery
  ansible.builtin.service:
    name: elastic-agent
    enabled: false
    state: stopped
