schema_version: 1
minimum_ludus_version: 2.3.7
architecture: amd64
build_tools:
  packer: 1.11.2
  packer_proxmox_plugin: 1.2.3
  python: ">=3.11"
images:
  tartarus-debian-12-template:
    url: https://cdimage.debian.org/cdimage/archive/12.15.0/amd64/iso-cd/debian-12.15.0-amd64-netinst.iso
  tartarus-remnux-ubuntu-20.04-template:
    url: https://cdimage.ubuntu.com/ubuntu-legacy-server/releases/20.04/release/ubuntu-20.04.1-legacy-server-amd64.iso
package_repositories:
  debian: https://deb.debian.org/debian
  ubuntu: http://archive.ubuntu.com/ubuntu
components:
  elastic_stack: 9.5.5
  elastic_agent: 9.5.5
  remnux_ludus_role: 1.0.1
  remnux_installer: 1.4.3
  remnux_distribution: v2024.44.3
  radare2_mcp: 1.8.8
  ghidra: "11.4.2"
  radare2: "6.1.8"
  gdb: "15.2"
  inetsim: "1.3.2"
  zeek: "7.2.2"
  temurin_jdk: "21.0.12.1+1"
artifacts:
  - filename: debian-12.15.0-amd64-netinst.iso
    url: https://cdimage.debian.org/cdimage/archive/12.15.0/amd64/iso-cd/debian-12.15.0-amd64-netinst.iso
    destination: templates/tartarus-debian-12/files
  - filename: ubuntu-20.04.1-legacy-server-amd64.iso
    url: https://cdimage.ubuntu.com/ubuntu-legacy-server/releases/20.04/release/ubuntu-20.04.1-legacy-server-amd64.iso
    destination: templates/tartarus-remnux-ubuntu-20.04/files
  - filename: remnux-cli-1.4.3-linux
    url: https://github.com/REMnux/remnux-cli/releases/download/v1.4.3/remnux-cli-linux
    destination: templates/tartarus-remnux-ubuntu-20.04/files
  - filename: zeek-7.2.2.tar.gz
    url: https://github.com/zeek/zeek/releases/download/v7.2.2/zeek-7.2.2.tar.gz
    destination: templates/tartarus-remnux-ubuntu-20.04/files
  - filename: remnux-salt-states-v2024.44.3.tar.gz
    url: https://github.com/REMnux/salt-states/archive/v2024.44.3.tar.gz
    destination: templates/tartarus-remnux-ubuntu-20.04/files
  - filename: remnux-salt-states-v2024.44.3.tar.gz.asc
    url: https://github.com/REMnux/salt-states/releases/download/v2024.44.3/remnux-salt-states-v2024.44.3.tar.gz.asc
    destination: templates/tartarus-remnux-ubuntu-20.04/files
  - filename: elasticsearch-9.5.5-amd64.deb
    url: https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-9.5.5-amd64.deb
    role: tartarus_elk
  - filename: kibana-9.5.5-amd64.deb
    url: https://artifacts.elastic.co/downloads/kibana/kibana-9.5.5-amd64.deb
    role: tartarus_elk
  - filename: elastic-agent-9.5.5-amd64.deb
    url: https://artifacts.elastic.co/downloads/beats/elastic-agent/elastic-agent-9.5.5-amd64.deb
    role: tartarus_agent
  - filename: ghidra_11.4.2_PUBLIC_20250826.zip
    url: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.4.2_build/ghidra_11.4.2_PUBLIC_20250826.zip
    role: tartarus_remnux
  - filename: OpenJDK21U-jdk_x64_linux_hotspot_21.0.12.1_1.tar.gz
    url: https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12.1%2B1/OpenJDK21U-jdk_x64_linux_hotspot_21.0.12.1_1.tar.gz
    role: tartarus_remnux
  - filename: r2mcp_1.8.8_amd64.deb
    url: https://github.com/radareorg/radare2-mcp/releases/download/1.8.8/r2mcp_1.8.8_amd64.deb
    role: tartarus_remnux
  - filename: radare2_6.1.8_amd64.deb
    url: https://github.com/radareorg/radare2/releases/download/6.1.8/radare2_6.1.8_amd64.deb
    role: tartarus_remnux
  - filename: gdb-15.2.tar.xz
    url: https://ftp.gnu.org/gnu/gdb/gdb-15.2.tar.xz
    role: tartarus_remnux
