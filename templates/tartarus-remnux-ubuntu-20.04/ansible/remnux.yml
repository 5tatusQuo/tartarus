---
- name: Build the pinned Tartarus REMnux template
  hosts: all
  become: true
  tasks:
    - name: Create the locked REMnux distribution account
      ansible.builtin.user:
        name: remnux
        shell: /bin/bash
        password_lock: true

    - name: Create the build artifact cache
      ansible.builtin.file:
        path: /var/cache/tartarus
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download pinned REMnux build artifacts
      ansible.builtin.get_url:
        url: "{{ item.url }}"
        dest: "/var/cache/tartarus/{{ item.name }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - name: remnux-cli-1.4.3-linux
          url: https://github.com/REMnux/remnux-cli/releases/download/v1.4.3/remnux-cli-linux
        - name: zeek-7.2.2.tar.gz
          url: https://github.com/zeek/zeek/releases/download/v7.2.2/zeek-7.2.2.tar.gz
        - name: remnux-salt-states-v2024.44.3.tar.gz
          url: https://github.com/REMnux/salt-states/archive/v2024.44.3.tar.gz
        - name: remnux-salt-states-v2024.44.3.tar.gz.asc
          url: https://github.com/REMnux/salt-states/releases/download/v2024.44.3/remnux-salt-states-v2024.44.3.tar.gz.asc
        - name: ghidra_11.4.2_PUBLIC_20250826.zip
          url: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.4.2_build/ghidra_11.4.2_PUBLIC_20250826.zip
        - name: r2mcp_1.8.8_amd64.deb
          url: https://github.com/radareorg/radare2-mcp/releases/download/1.8.8/r2mcp_1.8.8_amd64.deb
        - name: radare2_6.1.8_amd64.deb
          url: https://github.com/radareorg/radare2/releases/download/6.1.8/radare2_6.1.8_amd64.deb
        - name: gdb-15.2.tar.xz
          url: https://ftp.gnu.org/gnu/gdb/gdb-15.2.tar.xz

    - name: Install the pinned official REMnux installer
      ansible.builtin.copy:
        src: /var/cache/tartarus/remnux-cli-1.4.3-linux
        dest: /usr/local/bin/remnux
        owner: root
        group: root
        mode: "0755"
        remote_src: true

    - name: Create the pinned REMnux release cache
      ansible.builtin.file:
        path: /var/cache/remnux/cli/v2024.44.3
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Preload the pinned REMnux release inputs
      ansible.builtin.copy:
        src: "/var/cache/tartarus/{{ item }}"
        dest: "/var/cache/remnux/cli/v2024.44.3/{{ item }}"
        owner: root
        group: root
        mode: "0644"
        remote_src: true
      loop:
        - remnux-salt-states-v2024.44.3.tar.gz
        - remnux-salt-states-v2024.44.3.tar.gz.asc

    - name: Install the pinned REMnux distribution release
      ansible.builtin.command:
        argv:
          - /usr/local/bin/remnux
          - install
          - --mode=cloud
          - --user=remnux
          - --version=v2024.44.3
        creates: /etc/remnux-config

    - name: Reboot after REMnux installation
      ansible.builtin.reboot:
        reboot_timeout: 1800

    - name: Unpack the pinned Zeek source release
      ansible.builtin.unarchive:
        src: /var/cache/tartarus/zeek-7.2.2.tar.gz
        dest: /opt
        remote_src: true
        creates: /opt/zeek-7.2.2/configure

    - name: Configure the pinned Zeek build
      ansible.builtin.command:
        argv: [./configure, --prefix=/opt/zeek-7.2.2-install]
        chdir: /opt/zeek-7.2.2
        creates: /opt/zeek-7.2.2/build/Makefile

    - name: Build the pinned Zeek release
      ansible.builtin.command:
        argv: [make, -j2]
        chdir: /opt/zeek-7.2.2/build
        creates: /opt/zeek-7.2.2/build/src/zeek

    - name: Install the pinned Zeek release
      ansible.builtin.command:
        argv: [make, install]
        chdir: /opt/zeek-7.2.2/build
        creates: /opt/zeek-7.2.2-install/bin/zeek

    - name: Publish the pinned Zeek command
      ansible.builtin.file:
        src: /opt/zeek-7.2.2-install/bin/zeek
        dest: /usr/local/bin/zeek
        state: link
