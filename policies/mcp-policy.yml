version: 1
transport: stdio
sample_content_is_untrusted: true
evidence:
  retain_each_call: true
  hash_algorithm: sha256
  path_scope: current_run
ghidra:
  operations: [import, functions, disassembly, decompile, strings, xrefs, custom_script]
  path_scope: current_project
radare2:
  server: native_r2mcp
  version: 1.8.8
  operations: [open, analyze, functions, strings, imports, exports, sections, symbols, xrefs, decompile, disassemble, calculate]
  path_scope: current_sample
gdb:
  operations: [command_sequence, breakpoint, watchpoint, step, continue, threads, registers, stack, memory, signals, state_change]
  target_scope: current_debug_run
telemetry:
  operations: [health, run_search]
